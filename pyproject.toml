[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sky-ops"
version = "0.1.0"
description = "Supervised multi-agent flight-operations assistant (LangGraph + MCP + guardrails + HITL)"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-supervisor>=0.0.31,<0.1",
    "langchain>=1.4,<2",
    "langchain-core>=1.6,<2",
    "langchain-mcp-adapters>=0.3,<0.4",
    "mcp>=1.30,<2",
    "langchain-anthropic>=1.7,<2",
    "langchain-openai>=1.6,<2",
    "langchain-google-genai>=2.0,<5",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27,<1"]

[project.scripts]
skyops = "flight_ops.cli:main_sync"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
